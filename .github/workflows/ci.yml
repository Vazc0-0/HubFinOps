# Testes automáticos: rodam a cada push e pull request.
# Nada aqui precisa de Azure, de modelo de IA ou de segredo: só o código, os dados fictícios e o Docker do GitHub.
name: CI

on:
  push:
    branches: [main]   # nos branches do Dependabot quem roda é o pull_request (evita rodar 2 vezes)
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualidade:
    name: Qualidade do código (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install ruff==0.17.5
      - run: ruff check --output-format=github .

  testes:
    name: Testes (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.10" }
          - { os: ubuntu-latest, python: "3.13" }
          - { os: windows-latest, python: "3.13" }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Bateria do leitor, gabarito FinOps, receptor, relatório e documentação
        run: python tools/rodar.py ci
      - name: A documentação e o relatório versionados estão atualizados
        if: runner.os == 'Linux'
        run: |
          # só datas e horários podem mudar; qualquer outra diferença quer dizer que alguém mudou o código
          # ou os exemplos e esqueceu de rodar "python tools/rodar.py ci" antes do commit
          git diff --exit-code -I '^(created|updated):' -I 'Gerad[oa] (automaticamente|em)' -I '^# Relatório FinOps' -- docs relatorios
      - name: Logs das execuções
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: logs-${{ matrix.os }}-py${{ matrix.python }}
          path: relatorios/execucoes/

  ambiente:
    name: Ambiente Docker de ponta a ponta
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Subir Postgres + Grafana + receptor
        run: docker compose up -d --wait
      - name: Carregar os dados do piloto no Postgres
        run: python tools/carregar_grafana.py
      - name: Grafana provisionado, dados visíveis e alerta real virando chamado
        run: python tests/testar_ambiente.py
      - name: Logs dos containers
        if: failure()
        run: docker compose logs --no-color
      - name: Derrubar o ambiente
        if: always()
        run: docker compose down -v

  segredos:
    name: Nenhum segredo no repositório (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
