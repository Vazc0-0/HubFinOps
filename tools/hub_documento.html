<!doctype html>
<html lang="pt-BR" data-tema="escuro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{titulo}} · Hub FinOps</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400&display=swap">
<script>
  try { const t = localStorage.getItem('hub-tema'); if (t === 'claro' || t === 'escuro') document.documentElement.dataset.tema = t; } catch (e) {}
</script>
<style>
/* Documentos do hub: mesma identidade do painel FinOps (tokens e modo claro/escuro). */
:root, [data-tema="escuro"]{
  --bg:#0B0C0E; --frame:#141518; --frame-borda:#23252B; --nav:#0F1012; --nav-borda:#1F2126;
  --card:#1C1D21; --card-borda:#2A2C32; --texto:#F3F4F6; --texto2:#C9CCD4; --muted:#A1A5B0; --faint:#8B8F9A;
  --grade:#2A2C32; --eixo:#3A3C44; --ico-ativo:#26282E; --sub:#141518; --trilho:#2E3037; --chip:#2A2C32;
  --ok:#34D399; --alerta:#FB923C; --eco:#22D3EE; --k-custo:#34D399; --k-prev:#A78BFA; --k-eco:#22D3EE; --ico-fundo:#2A2C32;
  --producao:#818CF8; --desenvolvimento:#FBBF24; --integracao:#2DD4BF; --area:.28;
  color-scheme: dark;
}
[data-tema="claro"]{
  --bg:#E7EAF0; --frame:#F7F8FB; --frame-borda:#DCE0E8; --nav:#FFFFFF; --nav-borda:#E3E6ED;
  --card:#FFFFFF; --card-borda:#E3E6ED; --texto:#0F172A; --texto2:#334155; --muted:#5B6472; --faint:#6B7280;
  --grade:#E8EBF0; --eixo:#CBD5E1; --ico-ativo:#EEF0F5; --sub:#F3F5F9; --trilho:#E5E7EB; --chip:#EEF0F5;
  --ok:#047857; --alerta:#C2410C; --eco:#0E7490; --k-custo:#059669; --k-prev:#7C3AED; --k-eco:#0891B2; --ico-fundo:#F1F3F8;
  --producao:#4F46E5; --desenvolvimento:#D97706; --integracao:#0D9488; --area:.22;
  color-scheme: light;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--texto2);font:15px/1.65 Inter,'Segoe UI',system-ui,sans-serif;padding:18px}
header{max-width:940px;margin:0 auto;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
header a.voltar{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:10px;background:var(--card);border:1px solid var(--card-borda);color:var(--texto);font-weight:600;font-size:13px;text-decoration:none}
header code{color:var(--muted);font-size:12px;overflow-wrap:anywhere}
header button{margin-left:auto;padding:8px 12px;border-radius:10px;background:var(--card);border:1px solid var(--card-borda);color:var(--texto);font:600 12px Inter,sans-serif;cursor:pointer}
[data-tema="escuro"] .so-claro,[data-tema="claro"] .so-escuro{display:none}
article{max-width:940px;margin:14px auto 48px;padding:30px max(18px,3vw);background:var(--frame);border:1px solid var(--frame-borda);border-radius:22px}
h1,h2,h3,h4{color:var(--texto);line-height:1.25;font-weight:700}
h1{font-size:28px;font-weight:800;letter-spacing:-.3px;margin-top:0}h2{font-size:20px;margin-top:32px;border-bottom:1px solid var(--card-borda);padding-bottom:6px}h3{font-size:16px;margin-top:24px}
strong{color:var(--texto)}
a{color:var(--k-prev)}
code{font:.86em 'JetBrains Mono',ui-monospace,Consolas,monospace;background:var(--sub);border:1px solid var(--card-borda);border-radius:5px;padding:1px 5px}
pre{background:#08090B;color:#D6DAE3;border:1px solid var(--card-borda);border-radius:12px;padding:14px 16px;overflow:auto;font:13px/1.5 'JetBrains Mono',ui-monospace,Consolas,monospace}
pre code{background:none;border:0;padding:0;color:inherit}
pre.mermaid{background:var(--card);color:var(--texto);text-align:center}
.tabela{overflow-x:auto;margin:14px 0;background:var(--card);border:1px solid var(--card-borda);border-radius:14px}
table{border-collapse:collapse;width:100%;font-size:14px}
th{text-align:left;color:var(--muted);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid var(--card-borda);padding:10px 12px}
td{border-bottom:1px solid var(--grade);padding:9px 12px;vertical-align:top}
tr:last-child td{border-bottom:0}
blockquote{margin:14px 0;padding:10px 16px;border-left:4px solid var(--k-prev);background:var(--card);border-radius:0 10px 10px 0}
.wiki{color:var(--k-prev);font-weight:600}
</style>
</head>
<body>
<header><a class="voltar" href="/operacao#documentos">← Documentos</a><code>{{caminho}}</code><button type="button" id="tema"><span class="so-escuro">Modo claro</span><span class="so-claro">Modo escuro</span></button></header>
<article>
{{corpo}}
</article>
<script>
document.getElementById('tema').onclick = () => {
  const novo = document.documentElement.dataset.tema === 'claro' ? 'escuro' : 'claro';
  document.documentElement.dataset.tema = novo;
  try { localStorage.setItem('hub-tema', novo); } catch (e) {}
};
</script>
<script type="module">
// Desenha os diagramas Mermaid da documentação (fluxo das Logic Apps). Sem internet, o texto do diagrama continua visível.
try {
  const { default: mermaid } = await import('https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.esm.min.mjs');
  mermaid.initialize({ startOnLoad: false, theme: document.documentElement.dataset.tema === 'claro' ? 'neutral' : 'dark', securityLevel: 'strict' });
  await mermaid.run({ querySelector: 'pre.mermaid' });
} catch (e) { console.warn('Mermaid indisponível:', e); }
</script>
</body>
</html>
