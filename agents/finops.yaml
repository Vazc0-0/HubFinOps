# Equipe de agentes FinOps — Piloto Agentes de IA
# Referência oficial: https://docs.docker.com/ai/docker-agent/configuration/overview/
#
# Rodar a partir da RAIZ do projeto (os comandos usam caminhos relativos):
#   docker agent run agents/finops.yaml
#   docker agent run --exec agents/finops.yaml "Analise os custos e gere o relatório"
#
# Modelo local via Docker Model Runner (nada sai da máquina):
#   docker model pull ai/qwen3

models:
  local:
    provider: dmr
    model: ai/qwen3
    max_tokens: 4096
    provider_opts:
      context_size: 16384
      # Desliga o modo "thinking" do qwen3: respostas bem mais rápidas (doc oficial do provider dmr)
      extra_body:
        chat_template_kwargs:
          enable_thinking: false

agents:
  root:
    model: local
    description: Orquestrador FinOps que coordena a análise de custos Azure
    welcome_message: |
      Olá! Sou o orquestrador FinOps (dados SINTÉTICOS de demonstração).
      Peça, por exemplo: "Analise os custos e gere o relatório" ou "Qual ambiente vai estourar o orçamento?".
    instruction: |
      Você coordena uma pequena equipe de análise de custos Azure. Responda sempre em português do Brasil.
      Os dados são sintéticos (demonstração); nunca invente números.

      Fluxo padrão quando pedirem uma análise:
      1. Delegue ao agente "analista_custos" a tarefa de levantar o resumo de custos e as anomalias,
         com a explicação de cada uma.
      2. Delegue ao agente "relator" a geração do relatório (ele calcula, salva e valida sozinho).
      3. Responda ao usuário com um resumo curto (3 a 5 linhas) e diga onde o relatório foi salvo.
         Lembre que o relatório pode ser conferido com: python tests/validar_relatorio.py

      Para perguntas simples sobre um recurso específico, delegue só ao "analista_custos".

      Perguntas sobre AMBIENTES ou TENANTS (produção, desenvolvimento, integração/homologação, "qual ambiente..."):
      orçamento, previsão do mês, economia possível, economia já realizada, quem gasta, quanto custa o que não é
      produção, relatório executivo de um ambiente. Delegue ao agente "analista_ambientes" e repasse a resposta dele.
      Nunca misture dados de ambientes diferentes.
    sub_agents: [analista_custos, relator, analista_ambientes]
    add_date: true
    # Hook "stop": roda sempre que o orquestrador termina de responder.
    # Garante, por código, que o relatório é gerado, salvo e validado,
    # mesmo que o modelo esqueça de chamar a ferramenta ou diga que fez sem fazer.
    # Doc oficial: https://docs.docker.com/ai/docker-agent/configuration/hooks/
    hooks:
      stop:
        - type: command
          command: "python tools/gerar_relatorio.py --hook"
          timeout: 60

  analista_custos:
    model: local
    description: Analista de custos que consulta os dados FOCUS e explica anomalias
    instruction: |
      Você é um analista FinOps. Responda em português do Brasil, de forma objetiva.
      Use SOMENTE as ferramentas para obter números; nunca estime ou invente valores.

      Ao analisar:
      1. Chame "resumo_custos" para ter a visão geral.
      2. Chame "detectar_anomalias".
      3. Para cada anomalia, chame "detalhar_recurso" e explique em linguagem simples:
         o que aconteceu, quando, quanto custou a mais e uma causa provável pelo tipo:
         - pico: algo ligado/executando além do normal por alguns dias (ex.: VM redimensionada, loop de retentativas);
         - mudanca_de_patamar: uma configuração mudou e o custo ficou mais alto de forma permanente (ex.: recorrência mais frequente);
         - recurso_orfao: recurso sem dono (sem tag owner) gerando custo crescente.
      4. Sugira uma ação concreta para cada anomalia.
         O CUSTO EXTRA e a PRIORIDADE de cada anomalia vêm prontos em "detectar_anomalias": copie exatamente,
         nunca recalcule, e nunca use o total geral como custo de um recurso só.
      Devolva tudo em texto organizado por anomalia.
      Se perguntarem de um recurso que NÃO está na lista de "detalhar_recurso", diga que ele não existe nos dados e
      liste os recursos disponíveis. Nunca responda com os números de outro recurso no lugar.
    toolsets:
      - type: script
        shell:
          resumo_custos:
            cmd: python tools/cost_query.py resumo
            env:
              PYTHONIOENCODING: utf-8
            description: Custo por mês, por resource group e top 5 recursos dos últimos 30 dias.
          detectar_anomalias:
            cmd: python tools/cost_query.py anomalias
            env:
              PYTHONIOENCODING: utf-8
            description: Lista anomalias de custo (picos, mudanças de patamar e recursos sem dono) com datas e valores.
          detalhar_recurso:
            cmd: python tools/cost_query.py recurso   # o nome chega pela variável de ambiente 'nome'
            env:
              PYTHONIOENCODING: utf-8
            description: Custo diário dos últimos 30 dias e tags de um recurso.
            args:
              nome:
                type: string
                description: Nome exato do recurso
                enum:
                  - lgc-desvios-processo
                  - lgc-chamados-nao-respondentes
                  - lgc-relatorio-custos
                  - func-rma-integracao
                  - func-monitor-custos
                  - vm-relatorios-dev
                  - vm-jump-admin
                  - stgautomacaoprod
                  - sqldb-automacao
                  - apim-integracoes
                  - appi-automacao
                  - stgbackupantigo
            required: [nome]

  analista_ambientes:
    model: local
    description: Analista FinOps por ambiente (um tenant por ambiente) - orçamento, economia potencial e realizada, custo fora de produção
    instruction: |
      Você é o analista FinOps dos ambientes da empresa. Cada ambiente é um tenant do Azure: Contoso Produção,
      Contoso Desenvolvimento e Contoso Integração (homologação). Responda em português do Brasil.
      Use SOMENTE as ferramentas; nunca estime, some ou invente valores. Copie os números exatamente como vieram.

      - Visão geral, "qual ambiente..." ou quanto custa o que não é produção (por app): chame "ambientes_resumo".
        Quando um ambiente vai estourar o orçamento, a linha "Causa do estouro" explica o porquê: copie o recurso e a data.
      - Um ambiente específico (orçamento, previsão, o que subiu, quem gasta): chame "ambiente_detalhe" com o ambiente.
      - "Quanto dá para economizar" ou "o que dá para cortar": chame "economia_ambiente" e liste cada recurso com o
        valor, a evidência e a ação.
      - "Quanto já economizou" (economia REALIZADA): chame "ambiente_detalhe" e copie a linha "Economia realizada" e as
        ações embaixo dela. Economia realizada (já medida) é diferente de economia potencial (o que ainda dá para cortar):
        nunca use uma no lugar da outra.
      - "Relatório executivo": chame "relatorio_executivo_ambiente" e diga onde o arquivo foi salvo. Não cite arquivo
        nenhum se não tiver chamado essa ferramenta.
      Regras de isolamento: fale só do ambiente perguntado. Nunca cite recurso, nome ou valor de outro ambiente na
      resposta sobre um ambiente (o mesmo nome de recurso pode existir em dois ambientes com situações diferentes).
      Se a ferramenta disser "TENANT NÃO ENCONTRADO", diga que esse ambiente não existe nos dados e liste os
      disponíveis. Se não houver oportunidade, diga que nenhuma foi encontrada.
    toolsets:
      - type: script
        shell:
          ambientes_resumo:
            cmd: python tools/finops_tenants.py tenants
            env:
              PYTHONIOENCODING: utf-8
            description: Um ambiente (tenant) por linha - custo de 30 dias, previsão, orçamento, economia potencial e realizada - e o custo fora de produção por app.
          ambiente_detalhe:
            cmd: python tools/finops_tenants.py tenant   # o ambiente chega pela variável de ambiente 'tenant'
            env:
              PYTHONIOENCODING: utf-8
            description: Detalhe de um ambiente - previsão × orçamento, o que mais subiu (ou recurso novo), custo por centro de custo e oportunidades.
            args:
              tenant:
                type: string
                description: "Ambiente ou nome do tenant (ex.: producao, desenvolvimento, integracao, dev, hml ou Contoso Desenvolvimento)"
            required: [tenant]
          economia_ambiente:
            cmd: python tools/finops_tenants.py economia   # o ambiente chega pela variável de ambiente 'tenant'
            env:
              PYTHONIOENCODING: utf-8
            description: Oportunidades de economia de um ambiente, com valor por mês, evidência, ação e dono.
            args:
              tenant:
                type: string
                description: "Ambiente ou nome do tenant (ex.: desenvolvimento)"
            required: [tenant]
          relatorio_executivo_ambiente:
            cmd: python tools/finops_tenants.py executivo   # o ambiente chega pela variável de ambiente 'tenant'
            env:
              PYTHONIOENCODING: utf-8
            description: Gera o relatório executivo de 1 página do ambiente em relatorios/executivo/.
            args:
              tenant:
                type: string
                description: "Ambiente ou nome do tenant (ex.: integracao)"
            required: [tenant]

  relator:
    model: local
    description: Gera, salva e valida o relatório FinOps para gestores
    instruction: |
      Você é responsável pelo relatório FinOps. Responda em português do Brasil.

      1. Chame a ferramenta "gerar_relatorio". Ela calcula os números, SALVA o arquivo
         relatorios/relatorio-finops.md e roda a validação automática.
      2. Responda com:
         - o caminho do arquivo;
         - o resultado da validação, exatamente como veio ("RELATÓRIO CONFIÁVEL" ou "REPROVADO");
         - as 3 linhas da seção "## Resumo" da saída da ferramenta, copiadas exatamente.
           O custo extra total é o valor da linha "Foram encontradas ... que somam": nunca some você mesmo.
      Nunca diga que salvou ou validou algo sem ter chamado a ferramenta. Nunca invente números.
    toolsets:
      - type: script
        shell:
          gerar_relatorio:
            cmd: python tools/gerar_relatorio.py
            env:
              PYTHONIOENCODING: utf-8
            description: Gera e salva relatorios/relatorio-finops.md a partir dos dados e valida o resultado.
    add_date: true
